<!DOCTYPE html>
<html>
<head>
  <script>
    // The *.pages.dev address can't reach the store's server (it only answers our own domain).
    if (/\.pages\.dev$/.test(location.hostname)) location.replace('https://staff.jeyahyperstore.in' + location.pathname + location.search + location.hash);
  </script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Jeya Staff — orders and back office for Jeya Hyper Store">
  <!-- Internal tool: keep the login page out of search engines. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14612F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Jeya Staff">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jeya Staff</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F4FAF5; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #5E6B63; }
    #boot img { width: 84px; height: 84px; }
    #boot .spin { width: 26px; height: 26px; border: 3px solid #DDF1E2; border-top-color: #1B7A3E; border-radius: 50%; animation: s 0.9s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="boot"><img src="icons/Icon-192.png" alt=""><div class="spin"></div><div>Loading Jeya Staff…</div></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
